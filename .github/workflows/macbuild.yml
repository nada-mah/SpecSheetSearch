name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install system dependencies
      run: |
        brew update
        brew install cmake ninja libomp || true

    - name: 📦 Create virtual environment & install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install "llama-cpp-python==0.3.15"
        pip install -r requirements.txt
        pip install pyinstaller paddlex

    - name: 🛠 Build keySearch executable
      run: |
        source venv/bin/activate
        python build.py

    - name: 🧪 Test the built executable
      run: |
        ./dist/keySearch --help || echo "✅ Executed with fallback (non-zero exit ignored)"

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: keySearch
        path: dist/keySearch
