name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install system dependencies
      run: |
        brew update
        brew install cmake ninja libomp || true

    - name: 📦 Create venv & install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install "llama-cpp-python==0.3.15"
        pip install -r requirements.txt
        pip install pyinstaller paddlex
  
    - name: 🔧 Replace paddle base/core.py
      run: |
        source venv/bin/activate
        CORE_PATH="venv/lib/python3.12/site-packages/paddle/base/core.py"
        echo "🔍 Previewing first 10 lines of $CORE_PATH"
        head -n 10 "$CORE_PATH" || echo "⚠️ core.py not found"
        echo "🗑 Deleting $CORE_PATH"
        rm -f "$CORE_PATH"
        echo "📦 Copying repo core.py to $CORE_PATH"
        cp core.py "$CORE_PATH"
   
    - name: 🛠 Build keySearch
      run: |
        source venv/bin/activate
        python build.py

    - name: 🧪 Test executable
      run: |
        ./dist/keySearch --help || echo "✅ Executed with fallback"

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: keySearch
        path: dist/keySearch
