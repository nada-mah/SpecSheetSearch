name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install system dependencies
      run: |
        brew update
        # Added geos for shapely and ccache to speed up builds/fix warnings
        brew install cmake ninja libomp geos ccache || true

    - name: 📦 Create venv & install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        
        # Keep your specific version while adding OCR extras
        pip install "llama-cpp-python==0.3.15"
        
        # 🔥 CRITICAL: Install paddlex with [ocr] to satisfy the DependencyError
        # This keeps the versioning consistent but includes sub-deps like pyclipper/shapely
        pip install "paddlex[ocr]" 
        
        pip install -r requirements.txt
        pip install pyinstaller paddleocr

    - name: 🔧 Fix Paddle Binary Linkage & Inject core.py
      run: |
        source venv/bin/activate
        PADDLE_BASE="venv/lib/python3.12/site-packages/paddle/base"
        
        # Inject your custom "Universal" core.py (the one using hasattr/getattr)
        # This prevents the ImportError: cannot import name '_get_legacy_default_stream'
        cp core.py "$PADDLE_BASE/core.py"
        
        # Ensure libomp is accessible to the binary
        LIBOMP_PATH=$(brew --prefix libomp)/lib/libomp.dylib
        cp "$LIBOMP_PATH" "$PADDLE_BASE/"

    - name: 🛠 Build keySearch
      run: |
        source venv/bin/activate
        # Ensure your build.py uses --collect-all paddlex or --hidden-import paddlex.inference.models.ocr
        python build.py

    - name: 🧪 Run executable with test data
      run: |
        mkdir -p data/new_pdfs schema
        echo '{"fields": []}' > schema/test_schema.json
        touch data/new_pdfs/test.pdf

        ./dist/keySearch \
          --input=./data/new_pdfs \
          --schema=./schema/test_schema.json \
          || echo "⚠️ Runtime execution failed (check logs for missing imports)"

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: keySearch
        path: dist/keySearch