name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-latest      

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
                  
    - name: 📦 Install Python dependencies
      run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          export CMAKE_ARGS="-DGGML_METAL=ON" 
          export GGML_CPU_NO_I8MM=1
          pip install --no-binary :all: --force-reinstall llama-cpp-python
          pip install -r requirements.txt
          pip install pyinstaller paddlex chardet

    - name: 🛠 Build CLI binary
      run: |
        source venv/bin/activate
        python build.py

    - name: 🧪 Test the built executable
      run: |
        ./dist/keySearch --help || echo "✅ Executed with fallback (non-zero exit ignored)"

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: keySearch
        path: dist/keySearch
