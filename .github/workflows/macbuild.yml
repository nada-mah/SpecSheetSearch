name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install system dependencies
      run: |
        brew update
        brew install cmake ninja libomp ccache || true

    - name: 🧹 Clean old venv/build
      run: |
        rm -rf venv build dist *.spec

    - name: 📦 Install Python dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel numpy
        pip install -r requirements.txt
        pip install pyinstaller paddlex "llama-cpp-python==0.3.15"

    - name: 🛠 Build CLI binary
      run: |
        source venv/bin/activate
        rm -rf build dist keySearch.spec
        python build.py

    - name: 🧪 Test the built executable
      run: |
        ./dist/keySearch --help || echo "✅ Executed with fallback (non-zero exit ignored)"

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: keySearch
        path: dist/keySearch
