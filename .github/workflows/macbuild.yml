name: macOS App CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
    - name: ⬇️ Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 📦 Install system dependencies
      run: |
        brew update
        brew install cmake ninja libomp || true

    - name: 📦 Create venv & install dependencies
      run: |
        python -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install "llama-cpp-python==0.3.15"
        pip install -r requirements.txt
        pip install pyinstaller paddlex

    - name: 🔧 Replace paddle base/core.py
      run: |
        source venv/bin/activate
        CORE_PATH="venv/lib/python3.12/site-packages/paddle/base/core.py"
        rm -f "$CORE_PATH"
        cp core.py "$CORE_PATH"

    - name: 🛠 Build keySearch
      run: |
        source venv/bin/activate
        python build.py

    - name: 🧪 Test executable (help)
      run: |
        ./dist/keySearch --help || echo "✅ Help executed"

    # 🔥 NEW: actually run the program
    - name: 🧪 Run executable with test data
      run: |
        mkdir -p data/new_pdfs
        mkdir -p schema

        # Create dummy schema if not present
        echo '{"fields": []}' > schema/test_schema.json

        # (Optional) add a dummy PDF if none exists
        if [ -z "$(ls -A data/new_pdfs 2>/dev/null)" ]; then
          echo "⚠️ No PDFs found, creating placeholder"
          touch data/new_pdfs/test.pdf
        fi

        ./dist/keySearch \
          --input=./data/new_pdfs \
          --schema=./schema/test_schema.json \
          || echo "⚠️ Runtime execution failed (non-blocking)"

    - name: 📤 Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: keySearch
        path: dist/keySearch
